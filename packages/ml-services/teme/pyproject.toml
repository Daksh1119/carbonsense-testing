[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teme"
version = "1.0.0"
description = "Time-based Ecological Mitigation Engine (TEME)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
  { name = "CarbonSense Team" }
]

dependencies = []

[tool.setuptools]
packages = [
    "teme",
    "teme.core",
    "teme.api",
    "teme.data",
    "teme.ml",
    "teme.tests",
    "teme.utils",
    "teme.calibration",
    "teme.evaluation",
    "teme.simulation",
]

[tool.setuptools.package-dir]
"teme" = "."
"teme.core" = "core"
"teme.api" = "api"
"teme.data" = "data"
"teme.ml" = "ml"
"teme.tests" = "tests"
"teme.utils" = "utils"
"teme.calibration" = "calibration"
"teme.evaluation" = "evaluation"
"teme.simulation" = "simulation"

[tool.setuptools.package-data]
teme = [
    "ml/models/*.pkl",
    "data/*.json",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"